version: '3.8'

services:
  # Aplicação Unificada Videplast (Frontend React + Backend Express)
  videplast-estoque:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videplast_estoque_mrp
    restart: always
    ports:
      # Porta mapeada no servidor 192.168.1.106
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
